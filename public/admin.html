<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Samiksha's Mehendi Art</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#352012;background:#fff8ef}
*{box-sizing:border-box}
body{margin:0}
a{color:#a73811}
.shell{min-height:100vh;display:grid;grid-template-columns:260px 1fr}
.side{background:#6b2e1b;color:#fff;padding:22px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-size:20px;font-weight:800;line-height:1.15;margin-bottom:4px}
.side small{color:#ffd8bd}
.tabs{display:grid;gap:7px;margin-top:22px}
.tab{border:0;border-radius:7px;background:transparent;color:#fff;text-align:left;padding:11px 12px;cursor:pointer}
.tab.active,.tab:hover{background:#8e3c1e}
.main{padding:24px;min-width:0}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-size:24px;margin:0;color:#6b2e1b}
h2{font-size:18px;margin:0 0 12px;color:#6b2e1b}
h3{font-size:15px;margin:0;color:#6b2e1b}
.panel{background:#fff;border:1px solid #ecd7c3;border-radius:8px;box-shadow:0 2px 12px rgba(107,46,27,.07);padding:18px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
label{display:grid;gap:6px;font-size:13px;color:#6f5644}
input,textarea,select,button{font:inherit}
input,textarea,select{width:100%;border:1px solid #d9bfaa;border-radius:6px;padding:10px;background:#fffdfa;color:#352012}
textarea{min-height:86px;resize:vertical}
.jsonbox{min-height:54vh;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px;line-height:1.5}
button{border:0;border-radius:6px;background:#d9531e;color:#fff;padding:10px 13px;cursor:pointer}
button.secondary{background:#6b2e1b}
button.ghost{background:#f3dece;color:#6b2e1b}
button.danger{background:#b42318}
button:disabled{opacity:.55;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;gap:12px;align-items:center;justify-content:space-between}
.muted{color:#846a56;font-size:13px}
.msg{font-size:14px;margin-top:10px;min-height:20px}.ok{color:#147a3f}.err{color:#b42318}
.hidden{display:none!important}
.list{display:grid;gap:12px}
.item{border:1px solid #ecd7c3;border-radius:8px;padding:14px;background:#fffdf9}
.actions{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px}
.pill{display:inline-flex;border-radius:999px;background:#fff1e6;color:#8e3c1e;padding:5px 9px;font-size:12px}
.login{max-width:460px;margin:9vh auto}
.login .panel{padding:24px}
.toolbar{position:sticky;bottom:0;background:rgba(255,248,239,.95);border-top:1px solid #ecd7c3;padding:12px 0;margin-top:20px;backdrop-filter:blur(10px)}
@media(max-width:860px){.shell{display:block}.side{height:auto;position:relative}.tabs{grid-template-columns:repeat(2,minmax(0,1fr))}.main{padding:16px}.grid,.grid3{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div id="login" class="login">
  <div class="panel">
    <h1>Admin Login</h1>
    <p class="muted">Sign in to edit the live Cloudflare site.</p>
    <label>Password<input id="password" type="password" autocomplete="current-password"></label>
    <div class="row" style="margin-top:14px">
      <button id="loginBtn">Sign in</button>
      <a href="/">Open site</a>
    </div>
    <div id="loginMsg" class="msg"></div>
  </div>
</div>
<div id="app" class="shell hidden">
  <aside class="side">
    <div class="brand">Samiksha's<br>Mehendi Art</div>
    <small>Live admin panel</small>
    <nav class="tabs" id="tabs"></nav>
  </aside>
  <main class="main">
    <div class="top">
      <div><h1 id="pageTitle">Business</h1><div class="muted" id="revText"></div></div>
      <div class="row"><a href="/" target="_blank">Open site</a><button class="ghost" id="reloadBtn">Reload</button><button id="saveTopBtn">Save changes</button></div>
    </div>
    <div id="content"></div>
    <div class="toolbar">
      <div class="between">
        <div id="msg" class="msg"></div>
        <div class="row"><button class="ghost" id="jsonSyncBtn">Advanced JSON</button><button class="secondary" id="resetBtn">Reset defaults</button><button id="saveBtn">Save changes</button></div>
      </div>
    </div>
  </main>
</div>
<script>
const TABS=[['business','Business info'],['banner','Banner & images'],['designs','Mehandi designs'],['pricing','Pricing'],['reviews','Customer reviews'],['booking','Booking form'],['assistant','AI assistant'],['footer','Footer'],['json','JSON']];
const KINDS=['mandala','peacock','jaali','couple','doli','dancer','arabic','arabic2'];
let C=null,rev='',key=sessionStorage.getItem('adminKey')||'',tab='business';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const msg=(t,ok=true)=>{$('msg').textContent=t||'';$('msg').className='msg '+(ok?'ok':'err')};
const loginMsg=(t,ok=false)=>{$('loginMsg').textContent=t||'';$('loginMsg').className='msg '+(ok?'ok':'err')};
const pathGet=p=>p.split('.').reduce((o,k)=>o&&o[k],C);
function pathSet(p,v){const ks=p.split('.');let o=C;while(ks.length>1)o=o[ks.shift()];o[ks[0]]=v}
const field=(l,p,t='text')=>`<label>${l}<input data-path="${esc(p)}" type="${t}" value="${esc(pathGet(p)??'')}"></label>`;
const area=(l,p,r=3)=>`<label>${l}<textarea data-path="${esc(p)}" rows="${r}">${esc(pathGet(p)??'')}</textarea></label>`;
const numberField=(l,p)=>field(l,p,'number');
async function api(path,options={}){const headers=Object.assign({'Content-Type':'application/json'},options.headers||{});if(key)headers['X-Admin-Key']=key;const res=await fetch(path,Object.assign({},options,{headers}));const text=await res.text();let data={};try{data=text?JSON.parse(text):{}}catch(_){data={error:text}}if(!res.ok)throw new Error(data.error||res.statusText);return{data,res}}
async function loadContent(){const res=await fetch('/api/content',{cache:'no-store'});if(!res.ok)throw new Error('Could not load content');rev=res.headers.get('X-Content-Rev')||'';C=await res.json();render()}
async function login(){key=$('password').value.trim();try{await api('/api/login',{method:'POST',body:JSON.stringify({password:key})});sessionStorage.setItem('adminKey',key);await loadContent();$('login').classList.add('hidden');$('app').classList.remove('hidden');msg('Signed in. Edit fields and save when ready.')}catch(e){loginMsg(e.message)}}
function bindInputs(){document.querySelectorAll('[data-path]').forEach(el=>{el.addEventListener('input',()=>{pathSet(el.dataset.path,el.getAttribute('type')==='number'?Number(el.value||0):el.value);msg('Unsaved changes.')})})}
function renderTabs(){$('tabs').innerHTML=TABS.map(([id,label])=>`<button class="tab ${id===tab?'active':''}" data-tab="${id}">${label}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{if(!collectJson())return;tab=b.dataset.tab;render()});$('pageTitle').textContent=TABS.find(t=>t[0]===tab)[1];$('revText').textContent=rev?'Revision '+rev:'Loaded defaults'}
function render(){renderTabs();$('content').innerHTML={business:renderBusiness,banner:renderBanner,designs:renderDesigns,pricing:renderPricing,reviews:renderReviews,booking:renderBooking,assistant:renderAssistant,footer:renderFooter,json:renderJson}[tab]();bindInputs();bindButtons()}
function renderBusiness(){return `<section class="panel"><h2>Business info</h2><div class="grid">${field('First name','business.name')}${field('Brand suffix','business.brandSuffix')}${field('WhatsApp number','business.whatsapp')}${field('Rating','business.rating')}${field('Bookings count','business.bookingsCount')}${field('Address','business.address')}${field('Hours','business.hours')}${field('Service area','business.serviceArea')}${field('Primary button','business.ctaPrimary')}${field('Sticky button','business.ctaSticky')}${area('Tagline line 1','business.tagline1')}${area('Tagline line 2','business.tagline2')}${area('WhatsApp greeting','business.whatsappGreeting')}${area('Secondary CTA','business.ctaSecondary')}${field('Logo image URL','business.logo.image')}${numberField('Logo height','business.logo.height')}</div></section><section class="panel"><div class="between"><h2>Stats</h2><button class="ghost" data-add="stats">Add stat</button></div><div class="list">${C.stats.map((_,i)=>`<div class="item"><div class="grid">${field('Value',`stats.${i}.value`)}${field('Label',`stats.${i}.label`)}</div><div class="actions">${moveBtns('stats',i,C.stats.length)}<button class="danger" data-del="stats.${i}">Delete</button></div></div>`).join('')}</div></section>`}
function renderBanner(){return `<section class="panel"><h2>Banner</h2>${field('Banner label','banner.tag')}</section><section class="panel"><div class="between"><h2>Banner images</h2><button class="ghost" data-add="banner.collage">Add image</button></div><div class="list">${C.banner.collage.map((_,i)=>`<div class="item"><div class="grid3">${field('Image URL',`banner.collage.${i}.image`)}${numberField('Variant',`banner.collage.${i}.variant`)}${numberField('Tone',`banner.collage.${i}.tone`)}</div><div class="actions">${moveBtns('banner.collage',i,C.banner.collage.length)}<button class="danger" data-del="banner.collage.${i}">Delete</button></div></div>`).join('')}</div></section>${uploadPanel()}`}
function renderDesigns(){return `<section class="panel"><div class="between"><h2>Design sections</h2><button class="ghost" data-add="sections">Add section</button></div></section><div class="list">${C.sections.map((s,si)=>`<section class="panel"><div class="between"><h2>${esc(s.title||'Section')}</h2><div class="row">${moveBtns('sections',si,C.sections.length)}<button class="danger" data-del="sections.${si}">Delete section</button></div></div><div class="grid">${field('Key',`sections.${si}.key`)}${field('Title',`sections.${si}.title`)}${area('Subtitle',`sections.${si}.subtitle`)}</div><div class="between" style="margin-top:14px"><h3>Design cards</h3><button class="ghost" data-add="sections.${si}.items">Add design</button></div><div class="list" style="margin-top:10px">${s.items.map((_,di)=>designCard(si,di)).join('')}</div></section>`).join('')}</div>${uploadPanel()}`}
function designCard(si,di){const d=C.sections[si].items[di];return `<div class="item"><div class="between"><h3>${esc(d.label||'Design')}</h3><div class="row">${moveBtns(`sections.${si}.items`,di,C.sections[si].items.length)}<button class="danger" data-del="sections.${si}.items.${di}">Delete</button></div></div><div class="grid3">${field('ID',`sections.${si}.items.${di}.id`)}${field('Label',`sections.${si}.items.${di}.label`)}${field('Image URL',`sections.${si}.items.${di}.image`)}<label>Artwork kind<select data-path="sections.${si}.items.${di}.kind">${KINDS.map(k=>`<option ${d.kind===k?'selected':''}>${k}</option>`).join('')}</select></label>${numberField('Seed',`sections.${si}.items.${di}.seed`)}${numberField('Tone',`sections.${si}.items.${di}.tone`)}${field('Time',`sections.${si}.items.${di}.time`)}${field('Coverage',`sections.${si}.items.${di}.cover`)}${numberField('Starting price',`sections.${si}.items.${di}.from`)}</div><div style="margin-top:10px">${area('Description',`sections.${si}.items.${di}.blurb`,4)}</div></div>`}
function renderPricing(){return `<section class="panel"><h2>Pricing copy</h2><div class="grid">${field('Title','pricing.title')}${field('Subtitle','pricing.subtitle')}${area('Note','pricing.note')}</div></section><section class="panel"><div class="between"><h2>Packages</h2><button class="ghost" data-add="pricing.packages">Add package</button></div><div class="list">${C.pricing.packages.map((_,i)=>`<div class="item"><div class="grid">${field('Name',`pricing.packages.${i}.name`)}${numberField('Price',`pricing.packages.${i}.price`)}${field('Badge',`pricing.packages.${i}.badge`)}${area('Description',`pricing.packages.${i}.desc`)}</div><div class="actions">${moveBtns('pricing.packages',i,C.pricing.packages.length)}<button class="danger" data-del="pricing.packages.${i}">Delete</button></div></div>`).join('')}</div></section>`}
function renderReviews(){return `<section class="panel"><h2>Reviews copy</h2><div class="grid">${field('Title','testimonials.title')}${field('Subtitle','testimonials.subtitle')}</div></section><section class="panel"><div class="between"><h2>Reviews</h2><button class="ghost" data-add="testimonials.items">Add review</button></div><div class="list">${C.testimonials.items.map((_,i)=>`<div class="item"><div class="grid">${field('Name',`testimonials.items.${i}.name`)}${field('Meta',`testimonials.items.${i}.meta`)}${area('Review',`testimonials.items.${i}.text`,4)}</div><div class="actions">${moveBtns('testimonials.items',i,C.testimonials.items.length)}<button class="danger" data-del="testimonials.items.${i}">Delete</button></div></div>`).join('')}</div></section>`}
function renderBooking(){return `<section class="panel"><h2>Booking form</h2><div class="grid">${field('Title','booking.title')}${field('Subtitle','booking.subtitle')}${field('Submit label','booking.submitLabel')}${field('Design placeholder','booking.designPlaceholder')}</div></section>${stringList('Occasions','booking.occasions')}${stringList('Locations','booking.locations')}`}
function renderAssistant(){return `<section class="panel"><h2>Assistant</h2><div class="grid">${field('Header title','assistant.headerTitle')}${field('Header subtitle','assistant.headerSubtitle')}${area('Greeting','assistant.greeting',4)}${area('Fallback answer','assistant.fallback',4)}</div></section>${stringList('Quick questions','assistant.quick')}<section class="panel"><div class="between"><h2>Keyword answers</h2><button class="ghost" data-add="assistant.rules">Add rule</button></div><div class="list">${C.assistant.rules.map((_,i)=>`<div class="item"><div class="grid">${area('Keywords / regex',`assistant.rules.${i}.k`,2)}${area('Answer',`assistant.rules.${i}.r`,4)}</div><div class="actions">${moveBtns('assistant.rules',i,C.assistant.rules.length)}<button class="danger" data-del="assistant.rules.${i}">Delete</button></div></div>`).join('')}</div></section>`}
function renderFooter(){return `<section class="panel"><h2>Footer</h2>${field('Footer text','footer.text')}</section>`}
function renderJson(){return `<section class="panel"><div class="between"><h2>Advanced JSON</h2><span class="pill">Use carefully</span></div><textarea id="jsonBox" class="jsonbox">${esc(JSON.stringify(C,null,2))}</textarea></section>`}
function stringList(title,path){const arr=pathGet(path);return `<section class="panel"><div class="between"><h2>${title}</h2><button class="ghost" data-add="${path}">Add</button></div><div class="list">${arr.map((_,i)=>`<div class="item"><div class="row"><input data-path="${path}.${i}" value="${esc(arr[i])}"><div class="row">${moveBtns(path,i,arr.length)}<button class="danger" data-del="${path}.${i}">Delete</button></div></div></div>`).join('')}</div></section>`}
function uploadPanel(){return `<section class="panel"><h2>Upload image</h2><div class="row"><input id="file" type="file" accept="image/*"><button id="uploadBtn">Upload</button></div><div class="muted" style="margin-top:8px">After upload, paste the returned /uploads/... URL into an image field.</div><div id="uploadMsg" class="msg"></div></section>`}
function moveBtns(path,i,len){return `<button class="ghost" data-move="${path}.${i}.-1" ${i===0?'disabled':''}>Up</button><button class="ghost" data-move="${path}.${i}.1" ${i===len-1?'disabled':''}>Down</button>`}
function bindButtons(){document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{addItem(b.dataset.add);render();msg('Unsaved changes.')});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{delItem(b.dataset.del);render();msg('Unsaved changes.')});document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{moveItem(b.dataset.move);render();msg('Unsaved changes.')});const up=$('uploadBtn');if(up)up.onclick=upload}
function addItem(path){const arr=pathGet(path);if(!Array.isArray(arr))return;if(path==='stats')arr.push({value:'',label:''});else if(path==='banner.collage')arr.push({image:'',variant:0,tone:0});else if(path==='sections')arr.push({key:'new',title:'New Mehandi',subtitle:'',items:[]});else if(path.endsWith('.items'))arr.push({id:'design_'+Date.now(),label:'New Design',image:'',kind:'mandala',seed:0,tone:0,time:'',cover:'',from:0,blurb:''});else if(path==='pricing.packages')arr.push({name:'New Package',price:0,desc:'',badge:''});else if(path==='testimonials.items')arr.push({name:'',meta:'',text:''});else if(path==='assistant.rules')arr.push({k:'',r:''});else arr.push('')}
function delItem(path){if(!confirm('Delete this item?'))return;const bits=path.split('.');const index=Number(bits.pop());const arr=pathGet(bits.join('.'));if(Array.isArray(arr))arr.splice(index,1)}
function moveItem(raw){const bits=raw.split('.');const dir=Number(bits.pop());const index=Number(bits.pop());const arr=pathGet(bits.join('.'));const next=index+dir;if(!Array.isArray(arr)||next<0||next>=arr.length)return;[arr[index],arr[next]]=[arr[next],arr[index]]}
function collectJson(){if(tab!=='json')return true;const box=$('jsonBox');if(!box)return true;try{C=JSON.parse(box.value);return true}catch(e){msg('JSON error: '+e.message,false);return false}}
async function save(){if(!collectJson())return;try{const out=await api('/api/content',{method:'POST',headers:{'X-Content-Rev':String(rev||'')},body:JSON.stringify(C)});rev=out.data.rev||out.res.headers.get('X-Content-Rev')||rev;renderTabs();msg('Saved. Refresh the public site to see the update.')}catch(e){msg(e.message,false)}}
async function resetContent(){if(!confirm('Reset live content to bundled defaults?'))return;try{const out=await api('/api/reset',{method:'POST',body:'{}'});rev=out.data.rev||rev;await loadContent();msg('Reset complete.')}catch(e){msg(e.message,false)}}
async function upload(){const file=$('file')&&$('file').files[0];const out=$('uploadMsg');if(!file){out.textContent='Choose an image first.';out.className='msg err';return}const reader=new FileReader();reader.onload=async()=>{try{const res=await api('/api/upload',{method:'POST',body:JSON.stringify({name:file.name,dataUrl:reader.result})});out.textContent='Uploaded: '+res.data.url;out.className='msg ok'}catch(e){out.textContent=e.message;out.className='msg err'}};reader.readAsDataURL(file)}
$('loginBtn').onclick=login;$('password').onkeydown=e=>{if(e.key==='Enter')login()};$('reloadBtn').onclick=async()=>{await loadContent();msg('Reloaded.')};$('saveBtn').onclick=save;$('saveTopBtn').onclick=save;$('resetBtn').onclick=resetContent;$('jsonSyncBtn').onclick=()=>{if(collectJson()){tab='json';render();msg('JSON synced.')}};
if(key){$('password').value=key;login()}
</script>
</body>
</html>
